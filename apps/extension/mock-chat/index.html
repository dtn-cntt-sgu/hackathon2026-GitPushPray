<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat giả lập</title>
    <style>
      :root { --bg:#f0f2f5; --surface:#fff; --border:#dde1e7; --text:#1c1e21; --muted:#65676b; --me:#0866ff; --me-text:#fff; --them:#e4e6eb; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#18191a; --surface:#242526; --border:#3a3b3c; --text:#e4e6eb; --muted:#b0b3b8; --me:#2d88ff; --me-text:#fff; --them:#3a3b3c; }
      }
      * { box-sizing: border-box; }
      body { margin:0; font:15px/1.4 system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
      .wrap { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; min-height:100vh; }
      .panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; }
      .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
      select, input, button { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); }
      button { cursor:pointer; }
      button.primary { background:var(--me); color:var(--me-text); border-color:var(--me); }
      .note { color:var(--muted); font-size:13px; }
      .chat { flex:1; display:flex; flex-direction:column; }
      .chat h1 { font-size:16px; margin:0 0 8px; padding-bottom:8px; border-bottom:1px solid var(--border); }
      .thread { display:flex; flex-direction:column; gap:6px; min-height:300px; }
      .bubble { max-width:72%; padding:8px 12px; border-radius:18px; }
      .bubble[data-sender="other"] { align-self:flex-start; background:var(--them); }
      .bubble[data-sender="self"] { align-self:flex-end; background:var(--me); color:var(--me-text); }
      .compose { display:flex; gap:8px; margin-top:10px; }
      .compose input { flex:1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <div class="controls">
          <label for="scenario">Kịch bản</label>
          <select id="scenario"></select>
          <button id="next" class="primary">Phát tin tiếp</button>
          <button id="auto">Tự phát</button>
          <button id="rerender" title="Dựng lại toàn bộ DOM để kiểm thử khử trùng lặp">Render lại DOM</button>
        </div>
        <p class="note">Trang giả lập Messenger để demo và kiểm thử SafeChat AI. Đổi kịch bản = chuyển sang cuộc trò chuyện khác. Không có dữ liệu thật.</p>
      </div>
      <section class="panel chat">
        <h1 id="title"></h1>
        <div id="thread" class="thread"></div>
        <form id="compose" class="compose">
          <select id="sender" aria-label="Người gửi">
            <option value="other">Đối phương</option>
            <option value="self">Tôi</option>
          </select>
          <input id="text" placeholder="Nhập tin nhắn…" autocomplete="off" />
          <button type="submit">Gửi</button>
        </form>
      </section>
    </div>
    <script type="module" src="./mock.ts"></script>
  </body>
</html>
